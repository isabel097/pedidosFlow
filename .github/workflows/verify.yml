name: Verificación

on:
  push:
    branches:
      - main
      - fix/flujo-pedidos-persistente
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Empaquetar entrega ejecutable
        run: |
          rm -rf .artifact
          mkdir .artifact
          cp -R src .artifact/src
          cp -R docs .artifact/docs
          cp index.html package.json package-lock.json pnpm-lock.yaml tsconfig.json vite.config.ts README.md .gitignore .artifact/
          mkdir -p .artifact/.github/workflows
          cp .github/workflows/verify.yml .artifact/.github/workflows/verify.yml
          cp -R dist .artifact/dist
      - uses: actions/upload-artifact@v4
        with:
          name: PedidosFlow-capturas
          path: .artifact
          retention-days: 7
