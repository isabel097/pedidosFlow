name: Verificación del servidor PedidosFlow

on:
  pull_request:
    paths:
      - 'incremento2-servidor/**'
      - '.github/workflows/verify-incremento2.yml'
  push:
    branches:
      - main
      - feature/servidor-incremento-2
    paths:
      - 'incremento2-servidor/**'
      - '.github/workflows/verify-incremento2.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: incremento2-servidor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: incremento2-servidor/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run build:css
